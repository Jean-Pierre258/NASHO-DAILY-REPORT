<!DOCTYPE html>
<html lang="rw">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NASHO HEALTH CENTER - Daily Service Reporting System">
  <title>NASHO HEALTH CENTER | Daily Service Report</title>
  
  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- LUCIDE ICONS -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- CHART JS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* =====================================================
       RESET
    ====================================================== */
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:"Inter",sans-serif;
      background:#f4f7fb;
      color:#172033;
      min-height:100vh;
    }

    button,
    input,
    select,
    textarea{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .hidden{
      display:none !important;
    }

    /* =====================================================
       VARIABLES
    ====================================================== */
    :root{
      --primary:#087f5b;
      --primary-dark:#056044;
      --primary-light:#e8f8f2;
      --blue:#2563eb;
      --blue-light:#eff6ff;
      --purple:#7c3aed;
      --purple-light:#f5f3ff;
      --orange:#ea580c;
      --orange-light:#fff7ed;
      --red:#dc2626;
      --red-light:#fef2f2;
      --yellow:#ca8a04;
      --yellow-light:#fefce8;
      --text:#172033;
      --muted:#64748b;
      --border:#e2e8f0;
      --white:#ffffff;
      --shadow: 0 10px 30px rgba(15,23,42,.07);
      --shadow-lg: 0 20px 50px rgba(15,23,42,.12);
      --radius:18px;
    }

    /* =====================================================
       TOP HEADER
    ====================================================== */
    .top-nav{
      position:sticky;
      top:0;
      z-index:1000;
      min-height:76px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 28px;
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);
    }

    .brand-section{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo-badge{
      width:48px;
      height:48px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:15px;
      color:white;
      background: linear-gradient(135deg, #079669, #065f46);
      box-shadow: 0 8px 20px rgba(8,127,91,.25);
    }

    .logo-badge svg{
      width:26px;
      height:26px;
    }

    .brand-title-wrap{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .brand-title{
      font-family:"Outfit",sans-serif;
      font-size:20px;
      font-weight:800;
      color:#12372c;
    }

    .version-tag{
      font-size:10px;
      font-weight:800;
      padding:4px 7px;
      border-radius:20px;
      color:var(--primary);
      background:var(--primary-light);
    }

    .brand-subtitle{
      margin-top:2px;
      color:var(--muted);
      font-size:12px;
    }

    .nav-actions{
      display:flex;
      align-items:center;
      gap:10px;
    }

    /* =====================================================
       SHEET STATUS
    ====================================================== */
    .sheet-status-pill{
      display:flex;
      align-items:center;
      gap:7px;
      padding:8px 12px;
      border-radius:999px;
      background:#f8fafc;
      border:1px solid var(--border);
      font-size:12px;
      font-weight:600;
      cursor:pointer;
    }

    .status-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#94a3b8;
    }

    .status-dot.connected{
      background:#16a34a;
      box-shadow: 0 0 0 4px #dcfce7;
    }

    .status-dot.disconnected{
      background:#ef4444;
    }

    .lang-switch-group{
      display:flex;
      padding:3px;
      border-radius:10px;
      background:#f1f5f9;
    }

    .lang-btn{
      border:0;
      background:transparent;
      padding:6px 9px;
      border-radius:7px;
      font-size:11px;
      font-weight:700;
      color:#64748b;
    }

    .lang-btn.active{
      color:#fff;
      background:var(--primary);
    }

    .icon-action-btn{
      width:40px;
      height:40px;
      border:1px solid var(--border);
      background:white;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#475569;
    }

    .icon-action-btn:hover{
      color:var(--primary);
      border-color:#a7f3d0;
      background:var(--primary-light);
    }

    /* =====================================================
       MAIN TABS
    ====================================================== */
    .main-tabs{
      display:flex;
      gap:5px;
      padding:10px 28px;
      background:white;
      border-bottom:1px solid var(--border);
      overflow-x:auto;
    }

    .tab-btn{
      position:relative;
      display:flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
      border:0;
      background:transparent;
      color:#64748b;
      padding:11px 15px;
      border-radius:11px;
      font-size:13px;
      font-weight:700;
      transition:.2s ease;
    }

    .tab-btn:hover{
      color:var(--primary);
      background:#f0fdf9;
    }

    .tab-btn.active{
      color:var(--primary);
      background:var(--primary-light);
    }

    .counter-badge{
      min-width:20px;
      height:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      background:#e2e8f0;
      font-size:10px;
    }

    /* =====================================================
       CONTENT
    ====================================================== */
    .content-wrapper{
      width:min(1450px,100%);
      margin:auto;
      padding:28px;
    }

    .tab-pane{
      display:none;
      animation:fadeIn .35s ease;
    }

    .tab-pane.active{
      display:block;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(8px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .pane-header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:20px;
      margin-bottom:22px;
    }

    .pane-title{
      font-family:"Outfit",sans-serif;
      font-size:28px;
      font-weight:800;
      color:#13251f;
    }

    .pane-desc{
      margin-top:5px;
      color:var(--muted);
      font-size:14px;
    }

    .header-tools{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    /* =====================================================
       BUTTONS
    ====================================================== */
    .btn-primary,
    .btn-secondary,
    .btn-primary-outline,
    .btn-warning-outline{
      border-radius:11px;
      padding:10px 15px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      border:1px solid transparent;
      font-size:13px;
      font-weight:700;
      transition:.2s ease;
    }

    .btn-primary{
      color:white;
      background:var(--primary);
      box-shadow: 0 7px 18px rgba(8,127,91,.2);
    }

    .btn-primary:hover{
      background:var(--primary-dark);
      transform:translateY(-1px);
    }

    .btn-secondary{
      color:#475569;
      background:white;
      border-color:var(--border);
    }

    .btn-secondary:hover{
      border-color:#94a3b8;
      background:#f8fafc;
    }

    .btn-primary-outline{
      color:var(--primary);
      background:white;
      border-color:#86efac;
    }

    .btn-primary-outline:hover{
      background:var(--primary-light);
    }

    .btn-warning-outline{
      color:#c2410c;
      background:white;
      border-color:#fdba74;
    }

    .btn-warning-outline:hover{
      background:#fff7ed;
    }

    .btn-sm{
      padding:7px 10px;
      font-size:11px;
    }

    /* =====================================================
       FORM CARDS
    ====================================================== */
    .form-card,
    .content-card,
    .table-card,
    .filter-card{
      background:white;
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      margin-bottom:18px;
    }

    .form-card{
      padding:23px;
    }

    .content-card{
      padding:22px;
    }

    .card-header-line{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:20px;
    }

    .card-header-line.between{
      justify-content:space-between;
    }

    .card-header-left{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .card-icon-wrap{
      width:40px;
      height:40px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:none;
      border-radius:12px;
      color:var(--primary);
      background:var(--primary-light);
    }

    .card-icon-wrap.alert{
      color:var(--red);
      background:var(--red-light);
    }

    .card-header-line h3{
      font-family:"Outfit",sans-serif;
      font-size:16px;
      font-weight:800;
    }

    .section-hint{
      margin-top:3px;
      font-size:12px;
      color:var(--muted);
    }

    /* =====================================================
       FORM GRID
    ====================================================== */
    .form-grid{
      display:grid;
      gap:16px;
    }

    .grid-2{
      grid-template-columns: repeat(2,minmax(0,1fr));
    }

    .grid-3{
      grid-template-columns: repeat(3,minmax(0,1fr));
    }

    .grid-4{
      grid-template-columns: repeat(4,minmax(0,1fr));
    }

    .form-group{
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .form-group label,
    .filter-item label{
      font-size:12px;
      font-weight:700;
      color:#334155;
    }

    input,
    select,
    textarea{
      width:100%;
      border:1px solid #dbe3ec;
      border-radius:11px;
      background:white;
      color:#172033;
      padding:11px 13px;
      outline:none;
      transition:.2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus{
      border-color:#34d399;
      box-shadow: 0 0 0 4px rgba(16,185,129,.09);
    }

    textarea{
      resize:vertical;
      min-height:105px;
    }

    .input-with-icon{
      position:relative;
    }

    .input-with-icon svg{
      position:absolute;
      left:12px;
      top:50%;
      transform:translateY(-50%);
      width:17px;
      color:#94a3b8;
    }

    .input-with-icon input{
      padding-left:40px;
    }

    .text-muted{
      color:#94a3b8;
      font-size:11px;
    }

    .mt-3{
      margin-top:18px;
    }

    /* =====================================================
       TOAST
    ====================================================== */
    .toast-container{
      position:fixed;
      right:20px;
      bottom:20px;
      z-index:5000;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .toast{
      min-width:280px;
      max-width:380px;
      padding:13px 15px;
      display:flex;
      align-items:center;
      gap:10px;
      color:white;
      background:#172033;
      border-radius:13px;
      box-shadow:var(--shadow-lg);
      animation:toastIn .3s ease;
      font-size:12px;
      font-weight:600;
    }

    .toast.success{
      background:#087f5b;
    }

    .toast.error{
      background:#dc2626;
    }

    @keyframes toastIn{
      from{
        opacity:0;
        transform:translateX(20px);
      }
      to{
        opacity:1;
        transform:none;
      }
    }

    @media(max-width:1100px){
      .grid-4, .stats-grid{
        grid-template-columns: repeat(2,1fr);
      }
      .filter-grid{
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- TOP NAVIGATION -->
  <header class="top-nav">
    <div class="brand-section">
      <div class="logo-badge">
        <i data-lucide="activity"></i>
      </div>
      <div>
        <div class="brand-title-wrap">
          <h1 class="brand-title">NASHO HEALTH CENTER</h1>
          <span class="version-tag">v2.6</span>
        </div>
        <p class="brand-subtitle">Daily Service Reporting System</p>
      </div>
    </div>
    <div class="nav-actions">
      <div class="sheet-status-pill">
        <span class="status-dot connected" id="connectionDot"></span>
        <span id="connectionText">Connected to Sheet</span>
      </div>
    </div>
  </header>

  <!-- CONTENT WRAPPER -->
  <main class="content-wrapper">
    <div class="pane-header">
      <div>
        <h2 class="pane-title">Itangazo rya Serivisi</h2>
        <p class="pane-desc">Andika amakuru ya buri munsi kugira ngo yoherezwe muri Google Sheets na Email.</p>
      </div>
    </div>

    <!-- REPORT FORM CARD -->
    <div class="form-card">
      <div class="card-header-line">
        <div class="card-icon-wrap">
          <i data-lucide="file-text"></i>
        </div>
        <div>
          <h3>Form yo Kwemeza Raporo</h3>
          <p class="section-hint">Uzuza ibisabwa byose munsi aha</p>
        </div>
      </div>

      <form id="reportForm" onsubmit="submitDailyReport(event)">
        <div class="form-grid grid-2">
          <div class="form-group">
            <label for="reportDate">Tariki ya Raporo</label>
            <input type="date" id="reportDate" required>
          </div>
          <div class="form-group">
            <label for="serviceType">Ubwoko bwa Serivisi</label>
            <select id="serviceType" required>
              <option value="General Consultation">General Consultation</option>
              <option value="Maternity">Maternity</option>
              <option value="Laboratory">Laboratory</option>
              <option value="Pharmacy">Pharmacy</option>
            </select>
          </div>
        </div>

        <div class="form-grid grid-2 mt-3">
          <div class="form-group">
            <label for="totalPatients">Umubare w'Abarwayi (Total Patients)</label>
            <input type="number" id="totalPatients" min="0" placeholder="0" required>
          </div>
          <div class="form-group">
            <label for="reporterName">Uwitwara / Wandika Raporo</label>
            <input type="text" id="reporterName" placeholder="Amazina yawe" required>
          </div>
        </div>

        <div class="form-submit-panel mt-3" style="display:flex; justify-content:space-between; align-items:center; padding:15px; background:#f0fdf9; border:1px solid #bbf7d0; border-radius:12px;">
          <div>
            <span class="save-status-indicator"><i data-lucide="check-circle" style="width:14px;height:14px;"></i> Byiteguye koherezwa</span>
          </div>
          <div class="submit-actions">
            <button type="submit" class="btn-primary">
              <i data-lucide="send" style="width:16px;height:16px;"></i> Kohereza Raporo
            </button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <!-- TOAST NOTIFICATIONS -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- JAVASCRIPT INTEGRATION -->
  <script>
    // Google Apps Script Web App URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhQ1ibqGOXcd7jJ8AZpOhLEY46_Pr8VTkLkclY2i-18O3N_1qwr71gWm4-ycJYg8AmXQ/exec";

    document.addEventListener("DOMContentLoaded", () => {
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
      // Set default date to today
      const today = new Date().toISOString().split('T')[0];
      const dateInput = document.getElementById("reportDate");
      if(dateInput) dateInput.value = today;
    });

    function showToast(message, type = 'success') {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" style="width:18px;height:18px;"></i> <span>${message}</span>`;
      container.appendChild(toast);
      if (typeof lucide !== 'undefined') lucide.createIcons();
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    function submitDailyReport(event) {
      if (event) event.preventDefault();

      const reportData = {
        reportDate: document.getElementById("reportDate").value,
        serviceType: document.getElementById("serviceType").value,
        totalPatients: Number(document.getElementById("totalPatients").value) || 0,
        reporterName: document.getElementById("reporterName").value
      };

      showToast("Tegereza gato, amakuru ari koherezwa...", "success");

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(reportData)
      })
      .then(() => {
        showToast("Raporo yoherejwe kandi yabitswe neza!", "success");
        document.getElementById("reportForm").reset();
        const dateInput = document.getElementById("reportDate");
        if(dateInput) dateInput.value = new Date().toISOString().split('T')[0];
      })
      .catch((error) => {
        console.error("Habaye ikibazo:", error);
        showToast("Ntibyashobotse kohereza amakuru. Ongera ugerageze.", "error");
      });
    }
  </script>
</body>
</html>
